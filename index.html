<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#664055"><title>Колесо фортуны</title><style>
:root{font-family:'Segoe UI',sans-serif;color:#30252e;background:#f6f1e9}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 45%,#eee5db,transparent 65%)}main{max-width:1000px;margin:auto;padding:32px 20px 24px;text-align:center}.top{display:flex;align-items:center;justify-content:space-between;color:#664055;font-size:11px;letter-spacing:3px;text-transform:uppercase}.top span:last-child{letter-spacing:1px}h1{font:400 clamp(38px,6vw,66px)/1.1 Georgia,serif;letter-spacing:-2px;margin:30px 0 20px}h1 em{color:#664055;font-weight:400}.stage{position:relative;width:min(100%,560px);margin:24px auto 18px;filter:drop-shadow(0 15px 25px #66405522)}.wheel{display:block;width:100%;height:auto;border-radius:50%;border:9px solid #664055;outline:1px solid #b79a91;outline-offset:7px;transform-origin:50% 50%;will-change:transform}.pointer{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:32px;height:46px;background:#30252e;clip-path:polygon(0 0,100% 0,50% 100%);z-index:2}.hub{position:absolute;inset:calc(50% - 35px);width:70px;height:70px;border-radius:50%;background:#f6f1e9;display:grid;place-items:center;border:5px solid #664055;color:#664055;font-size:30px;box-shadow:0 3px 10px #30252e33}.result{min-height:70px;display:grid;place-content:center;margin:18px auto 12px}.result small{display:block;color:#6e6469;font-size:12px;letter-spacing:2px;margin-bottom:7px}.result strong{font:400 clamp(23px,4vw,29px)/1.3 Georgia,serif;color:#664055;max-width:620px;overflow-wrap:anywhere}button{border:0;background:#664055;color:#fff;border-radius:50px;min-height:58px;width:min(100%,310px);font:600 16px 'Segoe UI',sans-serif;cursor:pointer;box-shadow:0 7px 18px #66405525;transition:background .2s}button:hover{background:#493040}button:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #30252e;outline-offset:5px}.prizes{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;max-width:620px;margin:28px auto 0}.prizes span{border:1px solid #d9cec9;border-radius:30px;padding:8px 13px;font-size:12px}footer{margin-top:26px;color:#6e6469;font-size:11px;letter-spacing:2px}@media(max-width:520px){main{padding:24px 22px}.top{font-size:9px;letter-spacing:2px}h1{margin-top:25px}.stage{width:min(100%,440px);margin-top:27px}.result{margin-top:20px}.hub{inset:calc(50% - 28px);width:56px;height:56px;font-size:24px}.prizes{margin-top:22px;gap:7px}.prizes span{padding:6px 10px}footer{margin-top:22px}}
</style></head><body><main><div class="top"><span>Колесо фортуны</span><span>✦ 14 подарков</span></div><h1>Колесо <em>фортуны</em></h1><div class="stage"><div class="pointer" aria-hidden="true"></div><svg class="wheel" viewBox="0 0 480 480" role="img" aria-label="Колесо с четырнадцатью подарками"></svg><div class="hub" aria-hidden="true">✦</div></div><div class="result" role="status" aria-live="polite"><small>ВАШ ПОДАРОК</small><strong id="outcome">✦</strong></div><button id="spin" type="button">Вращать колесо ↗</button><div class="prizes" aria-label="Подарки"></div><footer>✦</footer></main><script src="wheel.js?v=4"></script></body></html>
